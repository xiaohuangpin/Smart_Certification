[project]
name = "smart-certification-backend"
version = "0.1.0"
description = "面向会计场景的轻量智能记账凭证生成后端"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "logfire>=5.5.0",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.66.0",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 保留外部提供的 agent 逻辑原文，仅调整了导入路径
"app/engine/agent/accounting_calc_agent.py" = ["E501", "F401", "I001"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

# 保留外部提供的 agent 逻辑原文，不做改写
[[tool.mypy.overrides]]
module = "app.engine.agent.accounting_calc_agent"
ignore_errors = true
